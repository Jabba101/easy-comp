# Builds the Windows versions of the Easy plugins on GitHub's own Windows
# computers.
#
# It runs by itself whenever files in this repository are uploaded or changed.
# You can also start it by hand: Actions tab > "Build Easy Plugins" > "Run workflow".
# When it finishes (green tick), the plugins are under "Artifacts" at the
# bottom of that run's page.

name: Build Easy Plugins

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows VST3
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Get the project files
        uses: actions/checkout@v7

      - name: Set up the build (downloads JUCE)
        run: cmake -S . -B build

      - name: Build the plugins
        shell: bash
        run: cmake --build build --config Release --parallel 2>&1 | tee build-log.txt

      # If the build fails, this copies the error lines onto the run's summary
      # page, so they're easy to find (and to paste to Claude).
      - name: Show any build errors
        if: failure()
        shell: bash
        run: |
          [ -f build-log.txt ] || exit 0
          errors=$(grep -E ": (fatal )?error|error [A-Z]+[0-9]+|CMake Error" build-log.txt | cut -c1-400 | head -n 25 || true)
          [ -n "$errors" ] || exit 0
          errors=${errors//'%'/'%25'}
          errors=${errors//$'\r'/}
          errors=${errors//$'\n'/'%0A'}
          echo "::error title=Build errors::$errors"

      # Writes a note on the run's summary page saying which plugins were made.
      - name: List the finished plugins
        shell: bash
        run: |
          cd "build/Finished Plugins"
          list=""
          for bundle in *.vst3; do
            [ -d "$bundle" ] || continue
            size=$(du -sk "$bundle" | awk '{ printf "%.1f MB", $1 / 1024 }')
            list="${list:+$list, }$bundle ($size)"
          done
          if [ -z "$list" ]; then
            echo "::error title=No plugins were built::The Finished Plugins folder is empty"
            exit 1
          fi
          echo "::notice title=Plugins built::$list"

      - name: Save the finished plugins
        uses: actions/upload-artifact@v7
        with:
          name: Easy-Plugins-Windows
          path: build/Finished Plugins/
          if-no-files-found: error
          retention-days: 30
