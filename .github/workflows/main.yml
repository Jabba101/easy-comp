# Builds the Windows version of Easy Comp on GitHub's own Windows computers.
#
# It runs by itself whenever files in this repository are uploaded or changed.
# You can also start it by hand: Actions tab > "Build Easy Comp" > "Run workflow".
# When it finishes (green tick), the plugin is under "Artifacts" at the bottom
# of that run's page.

name: Build Easy Comp

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows VST3
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Get the project files
        uses: actions/checkout@v7

      - name: Set up the build (downloads JUCE)
        run: cmake -S . -B build

      - name: Build the plugin
        run: cmake --build build --config Release --parallel

      - name: Save the finished plugin
        uses: actions/upload-artifact@v7
        with:
          name: Easy-Comp-Windows
          path: build/EasyComp_artefacts/Release/VST3/
          if-no-files-found: error
          retention-days: 30
