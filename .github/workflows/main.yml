# Builds the Windows versions of the Aardvark Easy Suite plugins on GitHub's
# own Windows computers.
#
# It runs by itself whenever files in this repository are uploaded or changed
# (except changes to just the DevTools folder, which isn't part of the plugins).
# You can also start it by hand: Actions tab > "Build Aardvark Easy Suite" > "Run workflow".
# When it finishes (green tick), the plugins are under "Artifacts" at the
# bottom of that run's page. The download's name ends with the date and time
# it was built (UK time), e.g. Aardvark-Easy-Suite-Windows-2026-10-21-1935,
# so you can always tell which one is the newest.

name: Build Aardvark Easy Suite

on:
  push:
    paths-ignore:
      - 'DevTools/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows VST3
    runs-on: windows-latest
    timeout-minutes: 120   # (a build from scratch takes about 40 minutes; with the cache, a few)
    env:
      SCCACHE_GHA_ENABLED: "true"   # sccache keeps its copies in GitHub's cache

    steps:
      # GitHub's computers run on UTC. Switching this one to UK time makes the
      # download's name, and the dates of the files inside it, match your clock.
      - name: Use UK time
        shell: pwsh
        run: tzutil /s "GMT Standard Time"

      - name: Get the project files
        uses: actions/checkout@v7

      # The Visual C++ compiler, ready to use from the command line
      - name: Set up the compiler
        uses: ilammy/msvc-dev-cmd@v1

      # sccache remembers every file it has compiled. Next time, anything
      # that hasn't changed (JUCE, and most of the plugins) is copied back
      # instead of compiled again - most builds then take a few minutes.
      - name: Set up the compile cache
        uses: mozilla-actions/sccache-action@v0.0.9

      # Link-time optimisation is off here (EASY_LTO): it re-optimises every
      # plugin as a whole at the end, which made each build take an hour.
      - name: Set up the build (downloads JUCE)
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DEASY_LTO=OFF
          -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl
          -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache

      - name: Build the plugins
        shell: bash
        run: |
          set -o pipefail
          cmake --build build --parallel 2>&1 | tee build-log.txt

      - name: How much the cache saved
        if: always()
        shell: bash
        run: sccache --show-stats || true

      # If the build fails, this copies the error lines onto the run's summary
      # page, so they're easy to find (and to paste to Claude).
      - name: Show any build errors
        if: failure()
        shell: bash
        run: |
          [ -f build-log.txt ] || exit 0
          errors=$(grep -E ": (fatal )?error|error [A-Z]+[0-9]+|CMake Error" build-log.txt | cut -c1-400 | head -n 25 || true)
          [ -n "$errors" ] || exit 0
          errors=${errors//'%'/'%25'}
          errors=${errors//$'\r'/}
          errors=${errors//$'\n'/'%0A'}
          echo "::error title=Build errors::$errors"

      # Writes a note on the run's summary page saying which plugins were made.
      - name: List the finished plugins
        shell: bash
        run: |
          cd "build/Finished Plugins"
          list=""
          for bundle in *.vst3; do
            [ -d "$bundle" ] || continue
            size=$(du -sk "$bundle" | awk '{ printf "%.1f MB", $1 / 1024 }')
            list="${list:+$list, }$bundle ($size)"
          done
          if [ -z "$list" ]; then
            echo "::error title=No plugins were built::The Finished Plugins folder is empty"
            exit 1
          fi
          echo "::notice title=Plugins built::$list"

      - name: Name the download after when it was built
        shell: pwsh
        run: '"BUILT=" + (Get-Date -Format "yyyy-MM-dd-HHmm") | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8'

      - name: Save the finished plugins
        uses: actions/upload-artifact@v7
        with:
          name: Aardvark-Easy-Suite-Windows-${{ env.BUILT }}
          path: build/Finished Plugins/
          if-no-files-found: error
          retention-days: 30
